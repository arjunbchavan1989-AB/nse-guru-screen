name: Daily Guru Scan and Pages
on:
  schedule:
    # 19:30 Asia/Kolkata every day; GitHub may delay scheduled jobs.
    - cron: '0 14 * * *'
    - cron: '15 14 * * *' # 19:45 IST guarded fallback
    - cron: '30 14 * * *' # 20:00 IST guarded fallback
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Acquire and validate completed NSE EOD data
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'pipeline/**'
      - 'shared/**'
      - 'tests/**'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: guru-daily
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache/restore@v5
        id: market-cache
        with:
          path: pipeline/cache
          key: guru-own-market-${{ runner.os }}-${{ github.run_id }}
          restore-keys: guru-own-market-${{ runner.os }}-
      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          npm ci --prefer-offline
      - name: Run scanner regression tests
        run: |
          python -m unittest discover -s tests -v
          npx tsx tests/tradingview.ts
          npm run check
      - name: Check own completed-session freshness
        id: freshness
        run: python pipeline/refresh_guard.py --snapshot client/public/data/latest.json --event "${{ github.event_name }}" --refresh-data "${{ inputs.refresh_data }}"
      - name: Independently acquire NSE universe and completed EOD prices
        if: steps.freshness.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/run.py 2>&1 | tee /tmp/guru-scan.log
      - name: Save own market and fundamental caches
        uses: actions/cache/save@v5
        if: always() && steps.freshness.outputs.refresh == 'true'
        with:
          path: pipeline/cache
          key: guru-own-market-${{ runner.os }}-${{ github.run_id }}
      - name: Commit validated daily data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/public/data snapshots pipeline/benchmark_midsmall400.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update validated Guru EOD snapshot [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push
          fi
      - name: Build client
        run: npx vite build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload client artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public
      - name: Deploy public dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
      - name: Upload scan diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: guru-scan-log
          path: /tmp/guru-scan.log
          if-no-files-found: ignore
      - name: Preserve own failed-run market cache for diagnosis
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: guru-own-failed-market-cache
          path: pipeline/cache
          retention-days: 3
          if-no-files-found: ignore
